<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 115" width="30" height="35" aria-hidden="true">
  <!-- Outer Arch with decorative dots -->
  <circle cx="50" cy="52" r="46" fill="#890000" stroke="#f5ede0" stroke-width="2.5"/>
  <circle cx="50" cy="52" r="38" fill="none" stroke="#f5ede0" stroke-width="1.8" stroke-dasharray="0.1 6.5" stroke-linecap="round"/>
  
  <!-- Crown / Headgear -->
  <path d="M 22 48 C 22 28 78 28 78 48 Z" fill="#890000" stroke="#f5ede0" stroke-width="2"/>
  <!-- Crown Flames/Feathers -->
  <path d="M 28 36 Q 32 20 35 34 Q 40 16 44 32 Q 50 12 56 32 Q 60 16 65 34 Q 68 20 72 36" fill="none" stroke="#f5ede0" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Crown Base Band with segments -->
  <path d="M 24 40 L 76 40 L 76 47 L 24 47 Z" fill="#b45309" stroke="#f5ede0" stroke-width="1.5"/>
  <line x1="32" y1="40" x2="32" y2="47" stroke="#f5ede0" stroke-width="1.2"/>
  <line x1="41" y1="40" x2="41" y2="47" stroke="#f5ede0" stroke-width="1.2"/>
  <line x1="50" y1="40" x2="50" y2="47" stroke="#f5ede0" stroke-width="1.2"/>
  <line x1="59" y1="40" x2="59" y2="47" stroke="#f5ede0" stroke-width="1.2"/>
  <line x1="68" y1="40" x2="68" y2="47" stroke="#f5ede0" stroke-width="1.2"/>

  <!-- Face Outline -->
  <path d="M 26 48 C 26 76 36 92 50 94 C 64 92 74 76 74 48 Z" fill="#890000" stroke="#f5ede0" stroke-width="2.5"/>

  <!-- Third eye / Pottu / Bindi -->
  <circle cx="50" cy="54" r="3.2" fill="#d97706" stroke="#f5ede0" stroke-width="1.5"/>

  <!-- Eyebrows -->
  <path d="M 30 61 Q 38 56 46 63" fill="none" stroke="#f5ede0" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 70 61 Q 62 56 54 63" fill="none" stroke="#f5ede0" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Almond Eyes -->
  <path d="M 31 66 Q 39 59 47 67 Q 39 74 31 66 Z" fill="#f5ede0"/>
  <circle cx="40" cy="66" r="2.5" fill="#1c1917"/>
  <path d="M 69 66 Q 61 59 53 67 Q 61 74 69 66 Z" fill="#f5ede0"/>
  <circle cx="60" cy="66" r="2.5" fill="#1c1917"/>

  <!-- Nose -->
  <path d="M 50 63 L 48 76 Q 50 78 52 76 Z" fill="none" stroke="#f5ede0" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Lips -->
  <path d="M 40 83 Q 50 80 60 83 Q 50 90 40 83 Z" fill="#f5ede0"/>
  <line x1="42" y1="83" x2="58" y2="83" stroke="#890000" stroke-width="1"/>

  <!-- Kundala / Circular Ear Ornaments -->
  <g fill="#890000" stroke="#f5ede0" stroke-width="2">
    <!-- Left Ear Earring -->
    <circle cx="19" cy="74" r="9"/>
    <!-- Right Ear Earring -->
    <circle cx="81" cy="74" r="9"/>
  </g>
  <circle cx="19" cy="74" r="3" fill="#d97706" stroke="#f5ede0" stroke-width="1"/>
  <circle cx="81" cy="74" r="3" fill="#d97706" stroke="#f5ede0" stroke-width="1"/>
</svg>
